<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMBER CODE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#17134a,#33217b);
  color: white;
  text-align: center;
  min-height: 100vh;
  padding: 25px 15px;
}
h1 { font-size: 42px; margin-bottom: 5px; }
.subtitle { color: #d8d2ff; }
.panel {
  max-width: 750px;
  margin: 25px auto;
  padding: 25px;
  background: #ffffff18;
  border: 1px solid #ffffff35;
  border-radius: 22px;
}
.slots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px;
}
.slot {
  width: 55px;
  height: 60px;
  border-bottom: 4px solid white;
  font-size: 32px;
  font-weight: bold;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2,minmax(120px,1fr));
  gap: 15px;
  max-width: 500px;
  margin: 25px auto;
}
.card {
  border: 4px solid white;
  border-radius: 18px;
  padding: 25px 10px;
  font-size: 25px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  min-height: 95px;
  box-shadow: 0 5px 0 #0005;
}
.card:active { transform: scale(.96); }
.red { background: #f04452; }
.blue { background: #2879e8; }
.green { background: #16a66a; }
.yellow { background: #e5a900; }
button {
  padding: 13px 25px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}
input {
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 18px;
  text-align: center;
  width: 180px;
  text-transform: uppercase;
}
#feedback { min-height: 28px; font-weight: bold; }
.hidden { display: none; }
</style>
</head>
<body>

<h1>🔐 NUMBER CODE</h1>
<p class="subtitle">Solve the Math. Reveal the Letters. Unlock the Word.</p>

<div class="panel">
  <h2>SOLO CHALLENGE</h2>
  <p>Score: <span id="score">0</span></p>
  <p>Answer the math question to reveal a hidden letter!</p>

  <div class="slots" id="slots"></div>

  <h2 id="question">12 + 7 = ?</h2>
  <div class="cards" id="cards">
    <button class="card red" onclick="answer(19)">19</button>
    <button class="card blue" onclick="answer(18)">18</button>
    <button class="card green" onclick="answer(17)">17</button>
    <button class="card yellow" onclick="answer(20)">20</button>
  </div>

  <p id="feedback"></p>

  <div id="challenge" class="hidden">
    <h2>WORD CHALLENGE</h2>
    <p id="clue">Clue: A bright object in the sky during daytime.</p>
    <input id="guess" placeholder="Enter mystery word">
    <br>
    <button onclick="checkWord()">SUBMIT</button>
  </div>
</div>

<script>
const rounds = [
  {
    question: "12 + 7 = ?",
    choices: [19,18,17,20],
    correct: 19,
    letter: "S"
  },
  {
    question: "15 + 6 = ?",
    choices: [20,21,22,19],
    correct: 21,
    letter: "U"
  },
  {
    question: "20 - 6 = ?",
    choices: [13,15,14,12],
    correct: 14,
    letter: "N"
  }
];

let current = 0;
let score = 0;
let letters = [];

function showSlots() {
  document.getElementById("slots").innerHTML =
    rounds.map((r,i) =>
      <div class="slot">${letters[i] || "?"}</div>
    ).join("");
}

function showRound() {
  const r = rounds[current];
  document.getElementById("question").textContent = r.question;

  const colors = ["red","blue","green","yellow"];
  document.getElementById("cards").innerHTML =
    r.choices.map((n,i) =>
      <button class="card ${colors[i]}" onclick="answer(${n})">${n}</button>
    ).join("");

  document.getElementById("feedback").textContent =
    "Choose your answer!";
  showSlots();
}

window.answer = function(value) {
  if (value === rounds[current].correct) {
    letters[current] = rounds[current].letter;
    score += 10;
    document.getElementById("score").textContent = score;
    document.getElementById("feedback").textContent =
      "Correct! You revealed the letter " + letters[current] + "!";
    showSlots();
    current++;

    setTimeout(() => {
      if (current < rounds.length) {
        showRound();
      } else {
        document.getElementById("question").textContent =
          "You unlocked all the letters!";
        document.getElementById("cards").classList.add("hidden");
        document.getElementById("challenge").classList.remove("hidden");
      }
    }, 1200);
  } else {
    document.getElementById("feedback").textContent =
      "Not quite! Try another answer.";
  }
};

function checkWord() {
  const guess = document.getElementById("guess").value.trim().toUpperCase();
  if (guess === "SUN") {
    document.getElementById("feedback").textContent =
      "🎉 AMAZING! You unlocked the mystery word!";
    document.getElementById("challenge").innerHTML =
      "<h2>🏆 YOU WIN!</h2><p>Final Score: " + score + "</p>" +
      '<button onclick="location.reload()">PLAY AGAIN</button>';
  } else {
    document.getElementById("feedback").textContent =
      "Try again! Look at the revealed letters and clue.";
  }
}

showRound();
</script>
</body>
</html>
